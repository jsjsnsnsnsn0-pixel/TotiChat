name: TotiChat Independent Admin Export
on:
  workflow_dispatch:
  push:
    branches:
      - feature/totichat-admin-staging-20261011
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/admin-standalone-export.yml"

permissions:
  contents: read

jobs:
  package-independent-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated admin development branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify and build dashboard only
        working-directory: admin-dashboard
        run: |
          node --check app.js
          node --check management.js
          node --check build.mjs
          npm run build
          node --test tests/admin-staging.test.mjs
      - name: Create standalone deployable archive
        shell: bash
        run: |
          mkdir -p /tmp/totichat-admin-independent
          cp admin-dashboard/index.html admin-dashboard/app.js admin-dashboard/management.js /tmp/totichat-admin-independent/
          cp admin-dashboard/styles.css admin-dashboard/management.css /tmp/totichat-admin-independent/
          cp admin-dashboard/package.json admin-dashboard/build.mjs admin-dashboard/vercel.json /tmp/totichat-admin-independent/
          cp -a admin-dashboard/assets admin-dashboard/tests admin-dashboard/staging-migrations /tmp/totichat-admin-independent/
          cat > /tmp/totichat-admin-independent/README.md <<'EOF'
          # TotiChat Admin — independent web project

          This repository contains ONLY the standalone TotiChat administration website,
          not the Android client or consumer app. It may be deployed or updated separately.

          ## Commands
          - `npm run build`: prepare static site in `dist/`.
          - `node --test tests/admin-staging.test.mjs`: run the contract tests after building.

          ## Vercel
          Create a new Vercel project linked to the separate Admin GitHub repository.
          Framework Other, Root Directory empty, Build Command `npm run build`,
          Output Directory `dist`. Do not use the old app's Vercel project.

          ## Security
          All API URLs point to Supabase STAGING, not production.
          Owner identity `xxjjh20@gmail.com` remains bound on the server.
          Server-side RPCs enforce permissions. Do not add a service-role key to the browser.
          Configure the exact new website HTTPS redirect in Supabase Auth to enable OAuth.
          The SQL files in `staging-migrations/` are historical reference ONLY.
          Never apply them blindly to production or repeat them on an already-migrated staging DB.

          ## Acceptance
          Static build/contract QA is not full login, banner-upload or financial E2E acceptance.
          Owner must verify with authorized Staging accounts before production cutover.
          EOF
          cat > /tmp/totichat-admin-independent/.gitignore <<'EOF'
          dist/
          node_modules/
          .vercel/
          .env*
          EOF
          (cd /tmp/totichat-admin-independent && npm run build && node --test tests/admin-staging.test.mjs)
          cd /tmp
          zip -qr /tmp/TotiChat-Admin-Independent.zip totichat-admin-independent
      - name: Upload standalone website artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotiChat-Admin-Independent-Source
          path: /tmp/TotiChat-Admin-Independent.zip
          retention-days: 30
          if-no-files-found: error
