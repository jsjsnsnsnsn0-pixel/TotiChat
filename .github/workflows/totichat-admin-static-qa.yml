name: TotiChat admin static preview QA
on:
  push:
    branches:
      - feature/totichat-admin-staging-20261011
    paths:
      - admin-dashboard/**
      - .github/workflows/totichat-admin-static-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate standalone admin dashboard; no Android build or production deploy
        run: |
          npm --prefix admin-dashboard run build
          npm --prefix admin-dashboard test
